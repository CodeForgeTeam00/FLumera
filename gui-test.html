<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>gui-test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="./assets/base.css">
    <link rel="stylesheet" href="./assets/header.css">
    <link rel="stylesheet" href="./assets/footer.css">
    <link rel="stylesheet" href="./assets/slider.css">

</head>
<button
        class="products-toolbar__button"
        type="button"
        data-filter-open=""
        aria-controls="mobile-filters-1"
        aria-expanded="false"
>
    <i class="lum-icon lum-icon--cart lum-icon--sm"></i>
    <span class="products-toolbar__button-text">Filters</span>
</button>


<div
        id="mobile-filters-1"
        class="lum-fdrawer"
        data-filter-drawer=""
        aria-hidden="true"
>
    <button
            class="lum-fdrawer__backdrop"
            type="button"
            data-filter-close=""
            aria-label="Close filters"
    ></button>

    <div
            class="lum-fdrawer__panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="fdrawer-title-1"
    >
        <div class="lum-fdrawer__handle"></div>

        <div class="lum-fdrawer__header">
            <div class="lum-fdrawer__title-wrap">
                <i class="lum-icon lum-icon--focus lum-icon--sm"></i>

                <h2
                        class="lum-fdrawer__title"
                        id="fdrawer-title-1"
                >
                    Filters
                </h2>
            </div>

            <button
                    class="lum-fdrawer__close"
                    type="button"
                    data-filter-close=""
                    aria-label="Close filters"
            >
                <i class="lum-icon lum-icon--x lum-icon--sm"></i>
            </button>
        </div>

        <div class="lum-fdrawer__content">

        </div>

        <div class="lum-fdrawer__footer">
            <button class="lum-fdrawer__clear" type="button">
                <i class="lum-icon lum-icon--x lum-icon--sm"></i>
                Clear Filters
            </button>

            <button class="lum-fdrawer__apply" type="button">
                View 256 Products
            </button>
        </div>
    </div>
</div>
