<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    /* Share button for testing */
    .share-btn {
        padding: 12px 20px;
        border: 0;
        border-radius: 8px;
        background: #16b364;
        color: #ffffff;
        font-size: 16px;
        cursor: pointer;
    }

    /* Modal */
    .share-modal {
        position: fixed;
        inset: 0;
        z-index: 9999;

        display: none;
        align-items: center;
        justify-content: center;
    }

    .share-modal.is-open {
        display: flex;
    }

    /* Background overlay */
    .share-modal__overlay {
        position: absolute;
        inset: 0;

        background: rgba(0, 0, 0, 0.3);
    }

    /* Modal content */
    .share-modal__content {
        position: relative;
        z-index: 1;

        width: 576px;
        max-width: calc(100% - 40px);

        padding: 72px 40px 40px;

        background: #ffffff;
        border-radius: 12px;

        box-shadow:
                0 20px 40px rgba(16, 24, 40, 0.12),
                0 8px 16px rgba(16, 24, 40, 0.08);
    }

    /* Close */
    .share-modal__close {
        position: absolute;
        top: 24px;
        right: 24px;

        display: flex;
        align-items: center;
        justify-content: center;

        width: 32px;
        height: 32px;

        padding: 0;
        border: 0;
        background: transparent;
        font-weight: 300;
        line-height: 1;

        cursor: pointer;
    }
    .share-modal__close i {
       color:  #253858;
    }

    /* Title */
    .share-modal__title {
        margin: 0;

        color: #101828;

        text-align: center;
        font-size: 20.25px;
        font-weight: 700;
        line-height: 36px;
    }

    /* Description */
    .share-modal__description {
        margin: 4px 0 0;

        color: #7A869A;

        text-align: center;
        font-size:14.22px;
        font-weight: 500;
        line-height: 28px;
    }

    /* Link box */
    .share-modal__link-box {
        display: flex;
        align-items: center;
        justify-content: space-between;

        width: 100%;
        height: 56px;

        margin-top: 24px;
        padding: 10px 12px;

        border: 1px solid #EBECF0;
        border-radius: 8px;

        background: #FAFBFC;
    }

    /* Link text */
    .share-modal__link {
        overflow: hidden;

        color: #667085;

        font-size: 16px;
        font-weight: 400;

        white-space: nowrap;
        text-overflow: ellipsis;
    }

    /* Copy icon */
    .share-modal__copy-icon {
        flex-shrink: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        margin-left: 12px;
        padding: 4px;

        border: 0;
        background: transparent;

        color: #101828;

        cursor: pointer;
    }

    /* Actions */
    .share-modal__actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;

        margin-top: 40px;
    }

    .share-modal__copy-btn,
    .share-modal__cancel-btn {

        height: 48px;

        border-radius: 8px;

        font-size: 14.22px;
        font-weight: 500;

        cursor: pointer;
    }

    .share-modal__copy-btn {
        border: 1px solid #EBECF0;

        background: #16b364;
        color: #ffffff;
    }

    .share-modal__copy-btn:hover {
        background: #15AE5C;
    }

    .share-modal__cancel-btn {
        border: 1px solid #d0d5dd;

        background: #ffffff;
        color: #101828;
    }

    .share-modal__cancel-btn:hover {
        background: #f9fafb;
    }


    /* ============================= */
    /* Hidden under 1024px */
    /* ============================= */

    @media (max-width: 1023px) {
        .share-modal {
            display: none !important;
        }

        .share-btn {
            display: none;
        }
    }
</style>

<!--js mobile share -->
<script>

    (function () {

        document.addEventListener('click', function (e) {

            var copyBtn = e.target.closest('[data-copy-link]');

            if (!copyBtn) return;

            e.preventDefault();

            var drawer = copyBtn.closest('[data-filter-drawer]');

            if (!drawer) return;

            var source = drawer.querySelector('[data-copy-source]');

            if (!source) return;

            var text = source.textContent.trim();

            navigator.clipboard.writeText(text)
                .then(function () {
                    console.log('Copied:', text);
                })
                .catch(function (err) {
                    console.error('Copy failed:', err);
                });

        });

    })();




    const shareBtn = document.getElementById("shareBtn");
    const shareModal = document.getElementById("shareModal");

    const closeModalBtn = document.getElementById("closeModalBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    const copyBtn = document.getElementById("copyBtn");
    const copyIconBtn = document.getElementById("copyIconBtn");

    const productLink = document.getElementById("productLink");
    const overlay = document.querySelector(".share-modal__overlay");


    function openModal() {
        // Modal should only work from 1024px and above
        if (window.innerWidth < 1024) {
            return;
        }

        shareModal.classList.add("is-open");

        document.body.style.overflow = "hidden";
    }


    function closeModal() {
        shareModal.classList.remove("is-open");

        document.body.style.overflow = "";
    }


    async function copyProductLink() {
        const link = productLink.textContent.trim();

        try {
            await navigator.clipboard.writeText(link);

            copyBtn.textContent = "Copied!";

            setTimeout(() => {
                copyBtn.textContent = "Copy link";
            }, 1500);

        } catch (error) {
            console.error("Copy failed:", error);
        }
    }


    /* Open */
    shareBtn.addEventListener("click", openModal);


    /* Close */
    closeModalBtn.addEventListener("click", closeModal);

    cancelBtn.addEventListener("click", closeModal);

    overlay.addEventListener("click", closeModal);


    /* Copy */
    copyBtn.addEventListener("click", copyProductLink);

    copyIconBtn.addEventListener("click", copyProductLink);


    /* ESC close */
    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
            closeModal();
        }
    });


    /* If screen becomes smaller than 1024px, close modal */
    window.addEventListener("resize", () => {
        if (window.innerWidth < 1024) {
            closeModal();
        }
    });
</script>
