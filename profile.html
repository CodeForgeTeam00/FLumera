<script>
    const accountItems = document.querySelectorAll(
        '.lum-account-sidebar__item:not(.lum-account-sidebar__item--logout)'
    );

    accountItems.forEach((item) => {
        item.addEventListener('click', (event) => {
            event.preventDefault();

            accountItems.forEach((link) => {
                link.classList.remove('lum-account-sidebar__item--active');
            });

            item.classList.add('lum-account-sidebar__item--active');
        });
    });
</script>
