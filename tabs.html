<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumera — Tabs component</title>
    <link rel="stylesheet" href="./assets/base.css">
    <link rel="stylesheet" href="./assets/tabs.css">
    <link rel="stylesheet" href="./assets/Lum-utilities.css">
</head>


<!-- ===== variant 1: pill (no icons) ===== -->
<div class="lum-tabs lum-tabs--pill flex flex-col items-center lg:items-start " data-tabs>
    <div class="lum-tabs__list" role="tablist" aria-label="Example pill tabs">
        <button class="lum-tabs__tab is-active" id="t1-1" role="tab" aria-selected="true"  aria-controls="p1-1" type="button">Lighting</button>
        <button class="lum-tabs__tab"           id="t1-2" role="tab" aria-selected="false" aria-controls="p1-2" tabindex="-1" type="button">Electrical</button>
        <button class="lum-tabs__tab"           id="t1-3" role="tab" aria-selected="false" aria-controls="p1-3" tabindex="-1" type="button">Control</button>
    </div>
    <div class="lum-tabs__panel" id="p1-1" role="tabpanel" aria-labelledby="t1-1"><!-- content --></div>
    <div class="lum-tabs__panel" id="p1-2" role="tabpanel" aria-labelledby="t1-2" hidden><!-- content --></div>
    <div class="lum-tabs__panel" id="p1-3" role="tabpanel" aria-labelledby="t1-3" hidden><!-- content --></div>
</div>

<!-- ===== variant 2: pill WITH icons (icon is just an optional child) ===== -->
<div class="lum-tabs lum-tabs--pill" data-tabs>
    <div class="lum-tabs__list" role="tablist" aria-label="Example pill tabs with icons">
        <button class="lum-tabs__tab is-active" id="t2-1" role="tab" aria-selected="true"  aria-controls="p2-1" type="button">
            <i class="lum-icon lum-icon--focus lum-icon--sm"></i> Lighting
        </button>
        <button class="lum-tabs__tab" id="t2-2" role="tab" aria-selected="false" aria-controls="p2-2" tabindex="-1" type="button">
            <i class="lum-icon lum-icon--screwdriver-bolt lum-icon--sm"></i> Electrical
        </button>
        <button class="lum-tabs__tab" id="t2-3" role="tab" aria-selected="false" aria-controls="p2-3" tabindex="-1" type="button">
            <i class="lum-icon lum-icon--tag lum-icon--sm"></i> Brands
        </button>
    </div>
    <div class="lum-tabs__panel" id="p2-1" role="tabpanel" aria-labelledby="t2-1"><!-- content --></div>
    <div class="lum-tabs__panel" id="p2-2" role="tabpanel" aria-labelledby="t2-2" hidden><!-- content --></div>
    <div class="lum-tabs__panel" id="p2-3" role="tabpanel" aria-labelledby="t2-3" hidden><!-- content --></div>
</div>

<!-- ===== variant 3: underline ===== -->
<div class="lum-tabs lum-tabs--underline" data-tabs>
    <div class="lum-tabs__list" role="tablist" aria-label="Example underline tabs">
        <button class="lum-tabs__tab is-active" id="t3-1" role="tab" aria-selected="true"  aria-controls="p3-1" type="button">Description</button>
        <button class="lum-tabs__tab"           id="t3-2" role="tab" aria-selected="false" aria-controls="p3-2" tabindex="-1" type="button">Specifics</button>
        <button class="lum-tabs__tab"           id="t3-3" role="tab" aria-selected="false" aria-controls="p3-3" tabindex="-1" type="button">Comments</button>
    </div>
    <div class="lum-tabs__panel" id="p3-1" role="tabpanel" aria-labelledby="t3-1"><!-- content --></div>
    <div class="lum-tabs__panel" id="p3-2" role="tabpanel" aria-labelledby="t3-2" hidden><!-- content --></div>
    <div class="lum-tabs__panel" id="p3-3" role="tabpanel" aria-labelledby="t3-3" hidden><!-- content --></div>
</div>

<!-- ===== variant 4: chip (outlined, active = green ring) ===== -->
<div class="lum-tabs lum-tabs--chip" data-tabs>
    <div class="lum-tabs__list" role="tablist" aria-label="Example chip tabs">
        <button class="lum-tabs__tab is-active" id="t4-1" role="tab" aria-selected="true"  aria-controls="p4-1" type="button">EnVision LED Lighting</button>
        <button class="lum-tabs__tab"           id="t4-2" role="tab" aria-selected="false" aria-controls="p4-2" tabindex="-1" type="button">Premium Lighting</button>
    </div>
    <div class="lum-tabs__panel" id="p4-1" role="tabpanel" aria-labelledby="t4-1"><!-- content --></div>
    <div class="lum-tabs__panel" id="p4-2" role="tabpanel" aria-labelledby="t4-2" hidden><!-- content --></div>
</div>


<script src="assets/tabs.js"></script>
</body>
</html>


<!-- FILTER CONTENT -->
<div class="products-filter-drawer__content w-full ">

    <div class="lum-accordion">

        <!-- PRICE RANGE -->
        <div class="lum-accordion__item" data-accordion-item="" data-open="">

            <button class="lum-accordion__summary" type="button" data-accordion-toggle="" aria-expanded="false">
                Accordion 1
                <i class="lum-icon lum-icon--chevron-right lum-icon--sm lum-accordion__caret"></i>
            </button>

            <div class="lum-accordion__body">

                <div class="lum-accordion__inner">

                    <div class="lum-accordion__details">

                        <div class="lum-range" data-range="" data-min="0" data-max="10000">

                            <div class="lum-range__fields">

                                <div class="lum-range__field">

                                    <span class="lum-range__field-label">
                                        From
                                    </span>

                                    <input class="lum-range__input" type="number" data-range-from="" value="1000">

                                    <span class="lum-range__suffix">
                                        $
                                    </span>

                                </div>

                                <div class="lum-range__field">

                                    <span class="lum-range__field-label">
                                        To
                                    </span>

                                    <input class="lum-range__input" type="number" data-range-to="" value="10000">

                                    <span class="lum-range__suffix">
                                        $
                                    </span>

                                </div>

                            </div>

                            <div class="lum-range__slider">

                                <div class="lum-range__rail"></div>

                                <div class="lum-range__fill" data-range-fill=""></div>

                                <div class="lum-range__thumbs">

                                    <input type="range" data-range-min="" min="0" max="10000" value="1000">

                                    <input type="range" data-range-max="" min="0" max="10000" value="10000">

                                </div>

                            </div>

                            <div class="lum-range__ends">

                                <span class="lum-range__end">
                                    Lowest
                                </span>

                                <span class="lum-range__end">
                                    Highest
                                </span>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- AVAILABILITY -->
        <div class="lum-accordion__item" data-accordion-item="" data-open="">

            <button class="lum-accordion__summary" type="button" data-accordion-toggle="" aria-expanded="false">
                Accordion 2
                <i class="lum-icon lum-icon--chevron-right lum-icon--sm lum-accordion__caret"></i>
            </button>

            <div class="lum-accordion__body">

                <div class="lum-accordion__inner">

                    <div class="lum-accordion__details">

                        <div class="switch-container flex flex-col gap-4">

                            <label class="lum-switch">

                                <span>In Stock</span>

                                <input class="lum-switch__input" type="checkbox">

                                <span class="lum-switch__track">
                                    <span class="lum-switch__thumb"></span>
                                </span>

                            </label>

                            <label class="lum-switch">

                                <span>In Stock</span>

                                <input class="lum-switch__input" type="checkbox">

                                <span class="lum-switch__track">
                                    <span class="lum-switch__thumb"></span>
                                </span>

                            </label>

                            <label class="lum-switch">

                                <span>In Stock</span>

                                <input class="lum-switch__input" type="checkbox">

                                <span class="lum-switch__track">
                                    <span class="lum-switch__thumb"></span>
                                </span>

                            </label>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- BRANDS -->
        <div class="lum-accordion__item" data-accordion-item="" data-open="">

            <button class="lum-accordion__summary" type="button" data-accordion-toggle="" aria-expanded="true">
                Accordion Actions
                <i class="lum-icon lum-icon--chevron-right lum-icon--sm lum-accordion__caret"></i>
            </button>

            <div class="lum-accordion__body">

                <div class="lum-accordion__inner">

                    <div class="lum-accordion__details">

                        <div class="switch-container flex flex-col gap-2">

                            <div class="lum-fsearch-group" data-fsearch="">

                                <div class="lum-fsearch">

                                    <i class="lum-icon lum-icon--search lum-icon--sm lum-fsearch__icon"></i>

                                    <input class="lum-fsearch__input" type="text" placeholder="Search Brand" data-fsearch-input="" aria-label="Search Brand">

                                </div>

                                <div class="lum-fsearch-list">

                                    <label class="lum-check lum-fsearch-list__row" data-fsearch-item="">

                                        <span class="lum-check__label">
                                            Nora
                                        </span>

                                        <input class="lum-check__input" type="checkbox">

                                        <span class="lum-check__box"></span>

                                    </label>

                                    <label class="lum-check lum-fsearch-list__row" data-fsearch-item="">

                                        <span class="lum-check__label">
                                            ali
                                        </span>

                                        <input class="lum-check__input" type="checkbox">

                                        <span class="lum-check__box"></span>

                                    </label>

                                    <label class="lum-check lum-fsearch-list__row" data-fsearch-item="">

                                        <span class="lum-check__label">
                                            fix
                                        </span>

                                        <input class="lum-check__input" type="checkbox">

                                        <span class="lum-check__box"></span>

                                    </label>

                                    <label class="lum-check lum-fsearch-list__row" data-fsearch-item="">

                                        <span class="lum-check__label">
                                            loaosdjj
                                        </span>

                                        <input class="lum-check__input" type="checkbox">

                                        <span class="lum-check__box"></span>

                                    </label>

                                    <p class="lum-fsearch__empty" data-fsearch-empty="" hidden>
                                        No matches
                                    </p>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- APPLICATION -->
        <div class="lum-accordion__item" data-accordion-item="" data-open="">

            <button class="lum-accordion__summary" type="button" data-accordion-toggle="" aria-expanded="true">
                Accordion Actions
                <i class="lum-icon lum-icon--chevron-right lum-icon--sm lum-accordion__caret"></i>
            </button>

            <div class="lum-accordion__body">

                <div class="lum-accordion__inner">

                    <div class="lum-accordion__details">

                        <div class="switch-container flex flex-col gap-2">

                            <label class="lum-check lum-fsearch-list__row" data-fsearch-item="">

                                <span class="lum-check__label">
                                    Nora
                                </span>

                                <input class="lum-check__input" type="checkbox">

                                <span class="lum-check__box"></span>

                            </label>

                            <label class="lum-check lum-fsearch-list__row" data-fsearch-item="">

                                <span class="lum-check__label">
                                    ali
                                </span>

                                <input class="lum-check__input" type="checkbox">

                                <span class="lum-check__box"></span>

                            </label>

                            <label class="lum-check lum-fsearch-list__row" data-fsearch-item="">

                                <span class="lum-check__label">
                                    fix
                                </span>

                                <input class="lum-check__input" type="checkbox">

                                <span class="lum-check__box"></span>

                            </label>

                            <label class="lum-check lum-fsearch-list__row" data-fsearch-item="">

                                <span class="lum-check__label">
                                    loaosdjj
                                </span>

                                <input class="lum-check__input" type="checkbox">

                                <span class="lum-check__box"></span>

                            </label>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- COLOR FAMILY -->
        <div class="lum-accordion__item" data-accordion-item="" data-open="">

            <button class="lum-accordion__summary" type="button" data-accordion-toggle="" aria-expanded="true">
                Accordion Actions
                <i class="lum-icon lum-icon--chevron-right lum-icon--sm lum-accordion__caret"></i>
            </button>

            <div class="lum-accordion__body">

                <div class="lum-accordion__inner">

                    <div class="lum-accordion__details">

                        <div class="lum-swatches">

                            <button class="lum-swatch is-selected" style="--_c:#2f80ed" type="button">
                                <span class="lum-swatch__chip"></span>
                                <span class="lum-swatch__name">Ocean</span>
                            </button>

                            <button class="lum-swatch" style="--_c:#27ae60" type="button">
                                <span class="lum-swatch__chip"></span>
                                <span class="lum-swatch__name">Forest</span>
                            </button>

                            <button class="lum-swatch" style="--_c:#e2542c" type="button">
                                <span class="lum-swatch__chip"></span>
                                <span class="lum-swatch__name">Sunset</span>
                            </button>

                            <button class="lum-swatch" style="--_c:#e84f8b" type="button">
                                <span class="lum-swatch__chip"></span>
                                <span class="lum-swatch__name">Rose</span>
                            </button>

                            <button class="lum-swatch" style="--_c:#5b6b83" type="button">
                                <span class="lum-swatch__chip"></span>
                                <span class="lum-swatch__name">Slate</span>
                            </button>

                            <button class="lum-swatch" style="--_c:#e74c3c" type="button">
                                <span class="lum-swatch__chip"></span>
                                <span class="lum-swatch__name">Coral</span>
                            </button>

                            <button class="lum-swatch" style="--_c:#c9a227" type="button">
                                <span class="lum-swatch__chip"></span>
                                <span class="lum-swatch__name">Sand</span>
                            </button>

                            <button class="lum-swatch" style="--_c:#9b2fae" type="button">
                                <span class="lum-swatch__chip"></span>
                                <span class="lum-swatch__name">Berry</span>
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
