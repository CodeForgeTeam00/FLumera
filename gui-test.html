<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>gui-test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="./assets/base.css">
    <link rel="stylesheet" href="./assets/header.css">
    <link rel="stylesheet" href="./assets/footer.css">
    <link rel="stylesheet" href="./assets/slider.css">
    <link rel="stylesheet" href="./assets/lum-brands.css">
    <link rel="stylesheet" href="./assets/catCard.css">
    <link rel="stylesheet" href="./assets/lum-hotspots.css">
    <link rel="stylesheet" href="./assets/tabs.css">
    <link rel="stylesheet" href="./assets/icons.css">
    <link rel="stylesheet" href="assets/Lum-utilities.css">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>


<button
        class="products-toolbar__button"
        type="button"
        data-filter-open="openBtn"
        aria-controls="mobile-filters-2"
        aria-expanded="false"
>
    <i class="lum-icon lum-icon--cart lum-icon--sm"></i>
    <span class="products-toolbar__button-text">Filters 2</span>
</button>


<div
        id="mobile-filters-2"
        class="lum-fdrawer"
        data-filter-drawer=""
        aria-hidden="true"
>
    <button
            class="lum-fdrawer__backdrop"
            type="button"
            data-filter-close=""
            aria-label="Close filters"
    ></button>

    <div
            class="lum-fdrawer__panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="fdrawer-title-2"
    >
        <div class="lum-fdrawer__handle"></div>

        <div class="lum-fdrawer__header">
            <div class="lum-fdrawer__title-wrap">
                <i class="lum-icon lum-icon--message  lum-icon--sm"></i>

                <h2
                        class="lum-fdrawer__title"
                        id="fdrawer-title-2"
                >
                    Filters
                </h2>
            </div>

            <button
                    class="lum-fdrawer__close"
                    type="button"
                    data-filter-close=""
                    aria-label="Close filters"
            >
                <i class="lum-icon lum-icon--close lum-icon--lg"></i>
            </button>
        </div>

        <div class="lum-fdrawer__content">
            <div class="w-full flex items-center justify-between   border-[1px] border-[#EBECF0] rounded-[8px] p-3 bg-[#FAFBFC]  ">
                <div>
                <span class="text-[14.22px] leading-7 font-[400] text-[#7A869A]">
                    lumeraelectric.com/product/S7593P
                </span>
                </div>
                <i class="lum-icon lum-icon--copy  lum-icon--sm "></i>
            </div>
        </div>

        <div class="lum-fdrawer__footer">
            <button class="lum-fdrawer__apply" type="button">
                Copy link
            </button>
            <button class="lum-fdrawer__clear" type="button">
                Cancel
            </button>

        </div>
    </div>
</div>



<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="assets/footer.js"></script>
<script src="assets/header.js"></script>
<script src="assets/heroSlider.js"></script>
<script src="assets/lum-hotspots.js"></script>
<script src="assets/global.js"></script>
<script src="assets/tabs.js"></script>
</body>
</html>
