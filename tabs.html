<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumera — Tabs component</title>
    <link rel="stylesheet" href="./assets/base.css">

</head>
<body style="padding:32px; display:flex; flex-direction:column; gap:56px;">

<!-- ===== variant 1: pill (no icons) ===== -->
<div class="lum-tabs lum-tabs--pill" data-tabs>
    <div class="lum-tabs__list" role="tablist" aria-label="Example pill tabs">
        <button class="lum-tabs__tab is-active" id="t1-1" role="tab" aria-selected="true"  aria-controls="p1-1" type="button">Lighting</button>
        <button class="lum-tabs__tab"           id="t1-2" role="tab" aria-selected="false" aria-controls="p1-2" tabindex="-1" type="button">Electrical</button>
        <button class="lum-tabs__tab"           id="t1-3" role="tab" aria-selected="false" aria-controls="p1-3" tabindex="-1" type="button">Control</button>
    </div>
    <div class="lum-tabs__panel" id="p1-1" role="tabpanel" aria-labelledby="t1-1"><!-- content --></div>
    <div class="lum-tabs__panel" id="p1-2" role="tabpanel" aria-labelledby="t1-2" hidden><!-- content --></div>
    <div class="lum-tabs__panel" id="p1-3" role="tabpanel" aria-labelledby="t1-3" hidden><!-- content --></div>
</div>

<!-- ===== variant 2: pill WITH icons (icon is just an optional child) ===== -->
<div class="lum-tabs lum-tabs--pill" data-tabs>
    <div class="lum-tabs__list" role="tablist" aria-label="Example pill tabs with icons">
        <button class="lum-tabs__tab is-active" id="t2-1" role="tab" aria-selected="true"  aria-controls="p2-1" type="button">
            <i class="lum-icon lum-icon--focus lum-icon--sm"></i> Lighting
        </button>
        <button class="lum-tabs__tab" id="t2-2" role="tab" aria-selected="false" aria-controls="p2-2" tabindex="-1" type="button">
            <i class="lum-icon lum-icon--screwdriver-bolt lum-icon--sm"></i> Electrical
        </button>
        <button class="lum-tabs__tab" id="t2-3" role="tab" aria-selected="false" aria-controls="p2-3" tabindex="-1" type="button">
            <i class="lum-icon lum-icon--tag lum-icon--sm"></i> Brands
        </button>
    </div>
    <div class="lum-tabs__panel" id="p2-1" role="tabpanel" aria-labelledby="t2-1"><!-- content --></div>
    <div class="lum-tabs__panel" id="p2-2" role="tabpanel" aria-labelledby="t2-2" hidden><!-- content --></div>
    <div class="lum-tabs__panel" id="p2-3" role="tabpanel" aria-labelledby="t2-3" hidden><!-- content --></div>
</div>

<!-- ===== variant 3: underline ===== -->
<div class="lum-tabs lum-tabs--underline" data-tabs>
    <div class="lum-tabs__list" role="tablist" aria-label="Example underline tabs">
        <button class="lum-tabs__tab is-active" id="t3-1" role="tab" aria-selected="true"  aria-controls="p3-1" type="button">Description</button>
        <button class="lum-tabs__tab"           id="t3-2" role="tab" aria-selected="false" aria-controls="p3-2" tabindex="-1" type="button">Specifics</button>
        <button class="lum-tabs__tab"           id="t3-3" role="tab" aria-selected="false" aria-controls="p3-3" tabindex="-1" type="button">Comments</button>
    </div>
    <div class="lum-tabs__panel" id="p3-1" role="tabpanel" aria-labelledby="t3-1"><!-- content --></div>
    <div class="lum-tabs__panel" id="p3-2" role="tabpanel" aria-labelledby="t3-2" hidden><!-- content --></div>
    <div class="lum-tabs__panel" id="p3-3" role="tabpanel" aria-labelledby="t3-3" hidden><!-- content --></div>
</div>

<!-- ===== variant 4: chip (outlined, active = green ring) ===== -->
<div class="lum-tabs lum-tabs--chip" data-tabs>
    <div class="lum-tabs__list" role="tablist" aria-label="Example chip tabs">
        <button class="lum-tabs__tab is-active" id="t4-1" role="tab" aria-selected="true"  aria-controls="p4-1" type="button">EnVision LED Lighting</button>
        <button class="lum-tabs__tab"           id="t4-2" role="tab" aria-selected="false" aria-controls="p4-2" tabindex="-1" type="button">Premium Lighting</button>
    </div>
    <div class="lum-tabs__panel" id="p4-1" role="tabpanel" aria-labelledby="t4-1"><!-- content --></div>
    <div class="lum-tabs__panel" id="p4-2" role="tabpanel" aria-labelledby="t4-2" hidden><!-- content --></div>
</div>



</body>
</html>
